name: W05 Windows shell regression

on:
  push:
    branches: [task/w05-windows-shell, task/w06-b-progression, task/w06-c-sound-ending, task/w09-c1-result-delivery]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - '.github/workflows/w05-windows-shell.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows-shell:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Resolve Windows build dependencies and record source
        run: |
          New-Item -ItemType Directory -Force out/w05-evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding ascii out/w05-evidence/source-sha.txt
          python -c "import tomllib,pathlib; p=tomllib.loads(pathlib.Path('backend/pyproject.toml').read_text()); pathlib.Path('out/w05-evidence/requirements.txt').write_text('\n'.join(p['project']['dependencies']+p['project']['optional-dependencies']['test']+['pytest==9.1.1','pyinstaller==6.22.3','setuptools==80.9.0']))"
          python -m pip install -r out/w05-evidence/requirements.txt --report out/w05-evidence/pip-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding ascii out/w05-evidence/requirements-resolved.txt
          python --version | Out-File -Encoding ascii out/w05-evidence/python-version.txt
          node --version | Out-File -Encoding ascii out/w05-evidence/node-version.txt
          npm --version | Out-File -Encoding ascii out/w05-evidence/npm-version.txt
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | ConvertTo-Json | Out-File out/w05-evidence/windows.json
      - name: Source backend and local runtime regressions
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v *> ../out/w05-evidence/unittest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_dialogue_service.py -v *> ../out/w05-evidence/dialogue-pytest.txt
          exit $LASTEXITCODE
      - name: Build React renderer
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Run local sound and content browser regressions
        working-directory: frontend
        run: |
          $playwrightRoot = Join-Path $env:RUNNER_TEMP 'nrnf-playwright'
          npm install --prefix $playwrightRoot --no-save --package-lock=false playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $playwrightRoot 'node_modules/playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vite = Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','dev','--','--host','127.0.0.1','--port','5173') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try { Invoke-WebRequest 'http://127.0.0.1:5173/' -TimeoutSec 2 | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite did not become ready for the local sound browser regression' }
            $env:PLAYWRIGHT_MODULE_PATH = Join-Path $playwrightRoot 'node_modules/playwright'
            $env:TEST_BASE_URL = 'http://127.0.0.1:5173'
            node tests/local-sound.browser.mjs *> ../out/w05-evidence/local-sound-browser.txt
            if ($LASTEXITCODE -ne 0) { Get-Content ../out/w05-evidence/local-sound-browser.txt; exit $LASTEXITCODE }
            Get-Content ../out/w05-evidence/local-sound-browser.txt
            node tests/local-content.browser.mjs *> ../out/w05-evidence/local-content-browser.txt
            if ($LASTEXITCODE -ne 0) { Get-Content ../out/w05-evidence/local-content-browser.txt; exit $LASTEXITCODE }
            Get-Content ../out/w05-evidence/local-content-browser.txt
            node tests/audio-packs.browser.mjs *> ../out/w05-evidence/audio-packs-browser.txt
            if ($LASTEXITCODE -ne 0) { Get-Content ../out/w05-evidence/audio-packs-browser.txt; exit $LASTEXITCODE }
            Get-Content ../out/w05-evidence/audio-packs-browser.txt
            node tests/difficulty.browser.mjs *> ../out/w05-evidence/difficulty-browser.txt
            if ($LASTEXITCODE -ne 0) { Get-Content ../out/w05-evidence/difficulty-browser.txt; exit $LASTEXITCODE }
            Get-Content ../out/w05-evidence/difficulty-browser.txt
          } finally {
            & taskkill.exe /PID $vite.Id /T /F 2>$null | Out-Null
          }
      - name: Freeze engine and package Electron shell
        run: |
          node --check desktop/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/quit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/test/quit.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $product = 'out/w05/package/No-Riichi-No-Fuku-win32-x64'
          if (-not (Test-Path "$product/No-Riichi-No-Fuku.exe")) { throw 'packaged Electron executable is missing' }
          python -c "import pathlib; p=pathlib.Path(r'$product'); total=sum(f.stat().st_size for f in p.rglob('*') if f.is_file()); pathlib.Path('out/w05-evidence/bundle-bytes.txt').write_text(str(total))"
      - name: Run packaged renderer, match, restart, and lifecycle smoke
        run: |
          $product = (Resolve-Path 'out/w05/package/No-Riichi-No-Fuku-win32-x64').Path
          $testRoot = Join-Path (Get-Location) 'out/w05-scratch/explicit-test-data'
          $evidence = Join-Path (Get-Location) 'out/w05-evidence/renderer-smoke.json'
          New-Item -ItemType Directory -Force (Split-Path $testRoot) | Out-Null
          @{ platform = 'win32'; arch = 'x64'; smokeStarted = $false; passed = $false; phase = 'workflow launch pending'; checks = @() } | ConvertTo-Json | Set-Content -Encoding utf8 $evidence
          $process = Start-Process -FilePath "$product/No-Riichi-No-Fuku.exe" -ArgumentList @('--smoke','--data',"`"$testRoot`"",'--evidence',"`"$evidence`"") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            if (Test-Path $evidence) { Get-Content $evidence -Raw }
            throw "packaged renderer smoke failed with exit $($process.ExitCode)"
          }
          $report = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($report.platform -ne 'win32' -or $report.arch -ne 'x64' -or -not $report.smokeStarted -or $report.passed -ne $true) {
            throw "packaged renderer smoke did not report a completed Windows x64 run (phase=$($report.phase), smokeStarted=$($report.smokeStarted), passed=$($report.passed))"
          }
          $required = @(
            'same-origin React loaded without login',
            'renderer saved next-match difficulty from its settings panel',
            'packaged renderer saved optional character measurement',
            'packaged renderer saved shared prompt, default, and character candidate',
            'character measurement survived progress reset',
            'shared prompt, default, and character candidate survived progress reset',
            'character measurement survived packaged engine restart',
            'shared prompt, default, and character candidate survived packaged engine restart',
            'active difficulty snapshot survived setting change and engine restart',
            'renderer opened local sound and ending settings',
            'new local profile starts silent with ending resources unregistered',
            'renderer name editor persisted the local profile',
            'renderer recovered roster selection after committed reset response loss',
            'renderer entered ending screen after completed-roster confirmation response',
            'renderer recovered omake selection after ending acknowledgement response loss',
            'renderer restored active turn after uncommitted reset failure',
            'renderer fixed participant roster before opponent selection',
            'active match restored after engine shutdown/restart at committed turn',
            'real renderer completed a normal local match',
            'result acknowledgement recovered after committed response loss',
            'renderer acknowledged every hand result and stopped at settlement',
            'completed result reconnected after engine restart without duplicate settlement',
            'packaged renderer restored pending settlement result after engine restart',
            'window close gracefully stopped the owned local engine'
          )
          $actual = @($report.checks | ForEach-Object { $_.name })
          $missing = @($required | Where-Object { $_ -notin $actual })
          if ($missing.Count -gt 0) { throw "renderer smoke omitted required checks: $($missing -join ', ')" }
          Get-Content $evidence -Raw
      - name: Verify packaged hand result facts read-only
        run: |
          $testRoot = Join-Path (Get-Location) 'out/w05-scratch/explicit-test-data'
          python backend/scripts/verify_hand_result_evidence.py (Join-Path $testRoot 'game.db') out/w05-evidence/hand-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content out/w05-evidence/hand-results.json -Raw
      - name: Verify packaged general-mode close, quit, timeout, and restart
        run: |
          $product = (Resolve-Path 'out/w05/package/No-Riichi-No-Fuku-win32-x64').Path
          $testRoot = Join-Path (Get-Location) 'out/w05-scratch/general-mode-data'
          $evidence = Join-Path (Get-Location) 'out/w05-evidence/shutdown-lifecycle.json'
          New-Item -ItemType Directory -Force (Split-Path $testRoot) | Out-Null
          @{ platform = 'win32'; arch = 'x64'; lifecycleTest = $false; checks = @() } | ConvertTo-Json | Set-Content -Encoding utf8 $evidence
          $process = Start-Process -FilePath "$product/No-Riichi-No-Fuku.exe" -ArgumentList @('--lifecycle-test','--data',"`"$testRoot`"",'--evidence',"`"$evidence`"") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            if (Test-Path $evidence) { Get-Content $evidence -Raw }
            throw "packaged general-mode lifecycle test failed with exit $($process.ExitCode)"
          }
          $report = Get-Content $evidence -Raw | ConvertFrom-Json
          if (-not $report.lifecycleTest -or $report.platform -ne 'win32' -or $report.arch -ne 'x64') { throw 'general-mode evidence is incomplete' }
          if (-not $report.timeoutChild.reaped -or -not $report.childClose -or -not $report.windowDestroyed -or -not $report.hostExit) { throw 'timeout/child/host exit evidence is missing' }
          if ($report.timeoutChild.pid -eq $report.enginePid) { throw 'timeout cleanup targeted the engine instead of its owned test child' }
          if ($report.shutdownStarted.enginePid -ne $report.childClose.pid -or $report.childClose.at -gt $report.windowDestroyed.at -or $report.windowDestroyed.at -gt $report.hostExit.at) { throw 'owned child and host exit order is invalid' }
          if ($report.hostExit.pid -ne $report.hostPid -or $report.hostExit.exitCode -ne 0) { throw 'host PID/exit result is invalid' }
          $actual = @($report.checks | ForEach-Object { $_.name })
          if ('general-mode timeout cleanup reaped only its owned child' -notin $actual -or 'packaged general mode loaded without --smoke' -notin $actual) { throw 'general-mode regression checks are missing' }
          Get-Content $evidence -Raw
          $restartEvidence = Join-Path (Get-Location) 'out/w05-evidence/restart-after-close.json'
          @{ platform = 'win32'; arch = 'x64'; lifecycleTest = $false; checks = @() } | ConvertTo-Json | Set-Content -Encoding utf8 $restartEvidence
          $restart = Start-Process -FilePath "$product/No-Riichi-No-Fuku.exe" -ArgumentList @('--lifecycle-test','--data',"`"$testRoot`"",'--evidence',"`"$restartEvidence`"") -PassThru -Wait -WindowStyle Hidden
          if ($restart.ExitCode -ne 0) { if (Test-Path $restartEvidence) { Get-Content $restartEvidence -Raw }; throw "same data-root restart failed with exit $($restart.ExitCode)" }
          $restartReport = Get-Content $restartEvidence -Raw | ConvertFrom-Json
          if (-not $restartReport.startup -or -not $restartReport.childClose -or -not $restartReport.hostExit) { throw 'same data-root restart evidence is incomplete' }
          'Packaged general-mode close and same-data-root restart passed.'
      - name: Package ZIP and hash
        if: success()
        run: |
          $product = 'out/w05/package/No-Riichi-No-Fuku-win32-x64'
          Compress-Archive -Path "$product/*" -DestinationPath out/w05-evidence/No-Riichi-No-Fuku-W05-Windows.zip -CompressionLevel Optimal
          Get-FileHash out/w05-evidence/No-Riichi-No-Fuku-W05-Windows.zip -Algorithm SHA256 | ConvertTo-Json | Out-File out/w05-evidence/zip-sha256.json
          Get-ChildItem out/w05-evidence -Recurse -File | Select-Object FullName,Length | ConvertTo-Json | Out-File out/w05-evidence/manifest-files.json
      - name: Upload exact-source Windows evidence and test ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/w05-evidence/
          retention-days: 14
