name: W04 Local storage regression

on:
  push:
    branches: [task/w04-local-storage]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/w04-local-storage.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows-storage-regression:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Prepare isolated dependencies and evidence
        run: |
          New-Item -ItemType Directory -Force out/w04-evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding ascii out/w04-evidence/source-sha.txt
          python -m venv out/w04-venv
          $venvScripts = Join-Path (Get-Location) 'out/w04-venv/Scripts'
          $venvScripts | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$venvScripts;$env:PATH"
          python -c "import tomllib,pathlib; p=tomllib.loads(pathlib.Path('backend/pyproject.toml').read_text()); pathlib.Path('out/w04-evidence/requirements.txt').write_text('\n'.join(p['project']['dependencies']+p['project']['optional-dependencies']['test']+['pytest==9.1.1']))"
          python -m pip install -r out/w04-evidence/requirements.txt --report out/w04-evidence/pip-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding ascii out/w04-evidence/requirements-resolved.txt
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | ConvertTo-Json | Out-File out/w04-evidence/windows.json
      - name: Backend regression and local storage recovery
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v *> ../out/w04-evidence/unittest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_dialogue_service.py -v *> ../out/w04-evidence/dialogue-pytest.txt
          exit $LASTEXITCODE
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Upload bounded W04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/w04-evidence/
          retention-days: 14
