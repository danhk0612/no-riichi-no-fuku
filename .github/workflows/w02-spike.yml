name: W02 Windows runtime spike
on:
  push:
    branches: [task/w02-windows-runtime-spike]
    paths: ['spikes/w02/**', '.github/workflows/w02-spike.yml']
  pull_request:
    paths: ['spikes/w02/**', '.github/workflows/w02-spike.yml']
permissions:
  contents: read
jobs:
  windows-spike:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Establish evidence path and resolve isolated dependencies
        run: |
          New-Item -ItemType Directory -Force spikes/w02/out/evidence | Out-Null
          git rev-parse HEAD | Out-File spikes/w02/out/evidence/source-sha.txt
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | ConvertTo-Json | Out-File spikes/w02/out/evidence/windows.json
          python -c "import tomllib,pathlib; p=tomllib.loads(pathlib.Path('backend/pyproject.toml').read_text()); pathlib.Path('spikes/w02/out/requirements.txt').write_text('\n'.join(p['project']['dependencies']+p['project']['optional-dependencies']['test']+['pytest==9.1.1','pyinstaller==6.22.3','setuptools==80.9.0']))"
          python -m pip install -r spikes/w02/out/requirements.txt --report spikes/w02/out/evidence/pip-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding ascii spikes/w02/out/evidence/requirements-resolved.txt
          python -m pip download --only-binary=:all: -r spikes/w02/out/evidence/requirements-resolved.txt -d spikes/w02/out/wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem spikes/w02/out/wheels | Get-FileHash -Algorithm SHA256 | Select-Object Hash,@{n='File';e={Split-Path $_.Path -Leaf}} | ConvertTo-Json | Out-File spikes/w02/out/evidence/wheel-hashes.json
          python -m pip install --no-index --find-links spikes/w02/out/wheels --force-reinstall -r spikes/w02/out/evidence/requirements-resolved.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record editable discovery error without changing product
        working-directory: backend
        run: |
          python -m pip install --dry-run --no-build-isolation -e . *> ../spikes/w02/out/evidence/editable.txt
          $result = $LASTEXITCODE
          "exit=$result" | Add-Content ../spikes/w02/out/evidence/editable.txt
          if ($result -eq 0) { throw 'Expected known discovery failure; inspect changed environment' }
          if (-not (Select-String -Path ../spikes/w02/out/evidence/editable.txt -Pattern 'Multiple top-level packages' -Quiet)) { throw 'Different editable failure; investigate' }
      - name: Source regression baseline
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v *> ../spikes/w02/out/evidence/unittest-source.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_dialogue_service.py -v *> ../spikes/w02/out/evidence/pytest-source.txt
          exit $LASTEXITCODE
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Existing browser checks
        id: browser
        continue-on-error: true
        run: |
          npm install --prefix spikes/w02/out/browser playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node spikes/w02/out/browser/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python spikes/w02/browser.py *> spikes/w02/out/evidence/browser.txt
          exit $LASTEXITCODE
      - name: Bundle Python and Electron in isolated tree
        run: |
          npm ci --prefix spikes/w02
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python spikes/w02/build.py *> spikes/w02/out/evidence/bundle.txt
          exit $LASTEXITCODE
      - name: ZIP and extract to a path with spaces and Korean characters
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,spikes/w02/README.md spikes/w02/out/shell/W02-Spike-win32-x64
          Compress-Archive -Path spikes/w02/out/shell/W02-Spike-win32-x64 -DestinationPath spikes/w02/out/W02-Spike.zip
          Get-FileHash spikes/w02/out/W02-Spike.zip | ConvertTo-Json | Out-File spikes/w02/out/evidence/zip-hash.json
          $target = Join-Path $env:RUNNER_TEMP 'W02 압축 해제'
          Expand-Archive spikes/w02/out/W02-Spike.zip $target
          "W02_EXTRACTED=$target/W02-Spike-win32-x64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem "$target/W02-Spike-win32-x64/resources/app/engine" -Recurse | Where-Object Extension -In '.dll','.pyd','.json','.ini' | Select-Object @{n='File';e={$_.FullName.Substring($target.Length)}},Length | ConvertTo-Json | Out-File spikes/w02/out/evidence/native-data-inventory.json
      - name: Frozen regression without Python in PATH
        id: frozen
        continue-on-error: true
        run: |
          $env:PATH = "$env:SystemRoot/System32"
          $env:PYTHONHOME = ''
          $env:PYTHONPATH = ''
          & "$env:W02_EXTRACTED/resources/app/engine/w02-engine.exe" regression *> spikes/w02/out/evidence/regression-frozen.txt
          exit $LASTEXITCODE
      - name: Extracted Electron renderer REST-WS match and restart smoke
        run: |
          $env:W02_EVIDENCE = Join-Path (Get-Location) 'spikes/w02/out/evidence/electron.json'
          $env:PATH = "$env:SystemRoot/System32"
          $env:PYTHONHOME = ''
          $env:PYTHONPATH = ''
          $p = Start-Process "$env:W02_EXTRACTED/W02-Spike.exe" -ArgumentList '--smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Electron spike exit=$($p.ExitCode)" }
          $evidence = Get-Content $env:W02_EVIDENCE -Raw | ConvertFrom-Json
          if ($evidence.passed -ne $true) { throw 'No passing renderer evidence' }
      - name: Require independent browser and frozen checks
        if: always()
        run: |
          'browser=${{ steps.browser.outcome }}; frozen=${{ steps.frozen.outcome }}' | Out-File spikes/w02/out/evidence/check-outcomes.txt
          if ('${{ steps.browser.outcome }}' -ne 'success' -or '${{ steps.frozen.outcome }}' -ne 'success') { throw 'Independent checks not all passed' }
      - name: Upload bounded evidence and test-only ZIP (no Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w02-windows-${{ github.sha }}
          path: |
            spikes/w02/out/evidence/
            spikes/w02/out/W02-Spike.zip
          retention-days: 14
