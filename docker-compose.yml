services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-no_riichi_no_fuku}
      POSTGRES_USER: ${POSTGRES_USER:-nrnf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nrnf} -d ${POSTGRES_DB:-no_riichi_no_fuku}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nrnf}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-no_riichi_no_fuku}
      SUPERADMIN_LOGIN_ID: ${SUPERADMIN_LOGIN_ID}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD}
      MEDIA_ROOT: /data/media
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
